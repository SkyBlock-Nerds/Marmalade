# JitPack builders come from two pools. "latest (cloud)" builders only have OpenJDK 8 installed, but
# carry on to the install step when a JDK install fails. "latest" (docker) builders abort on a failed
# install, and only some have JDK 25 preinstalled. SDKMAN, which JitPack uses for any other JDK, has
# been failing on both. With no jdk entry JitPack asks for the pom's JDK 25: docker hosts that have it
# use it, cloud builders fail the install and move on, and the build itself always runs on Temurin 25
# downloaded from Adoptium. Maven's home stays in the checkout because the wrapper has failed to start
# from ~/.m2 on JitPack.
install:
  - curl -fsSL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
  - bash -c 'export JAVA_HOME=/tmp/jdk25 PATH=/tmp/jdk25/bin:$PATH MAVEN_USER_HOME="$PWD/.jitpack-maven" && ./mvnw -B install -DskipTests -Deditorconfig.skip=true'
