# JitPack installs any other JDK through SDKMAN, which has been failing ("Download has failed",
# "INTERNET NOT REACHABLE"). OpenJDK 8 is preinstalled on every builder, so asking for it skips
# SDKMAN entirely; the build then runs on Temurin 25 downloaded straight from Adoptium. Maven's home
# stays inside the checkout because the wrapper has failed to start from ~/.m2 on JitPack.
jdk:
  - openjdk8
install:
  - curl -fsSL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
  - bash -c 'export JAVA_HOME=/tmp/jdk25 PATH=/tmp/jdk25/bin:$PATH MAVEN_USER_HOME="$PWD/.jitpack-maven" && ./mvnw -B install -DskipTests -Deditorconfig.skip=true'
